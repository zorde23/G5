; Profile of this project's title: the base profile, with the log in g5-last.log and Brazilian Portuguese as the console language.
[relinker]
--windows
--registry
--trace-imports
--frame-red-zone
--frame-shrink-wrapped
--precise-red-zone-guard
--frame-pointer-allocation
--frame-pointer-stub-jumps
--precise-red-zone-kills
--frame-exit-branches

[hybrid]
APS5_MIMALLOC=1
APS5_KYTY_GPU=1
APS5_RED_ZONE_GUARD=1
APS5_RED_ZONE_GUARD_BY_FRAME=1
APS5_NET_LOCAL_ONLY=1
KYTY_HYB_CLAMP_DONATED=1
DISABLE_RTSS_LAYER=1
DISABLE_VULKAN_OBS_CAPTURE=1
APS5_LOG_FILE=g5-last.log
ANYPS5_LANGUAGE=17
